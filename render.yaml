services:
  - type: web
    name: macrolens-scanner
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.8"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SCANNER_ACCESS_TOKEN
        sync: false
